<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#205b7a] w-full min-h-screen flex flex-col justify-center items-center">
    <p class="text-5xl font-mono mb-5 text-white">Digital Clock</p>
    <div id="clock" class="bg-red-500 w-1/4 h-40 p-4 flex justify-evenly items-center rounded-2xl">
        <div class="bg-sky-400 w-[25%] h-[65%] text-7xl text-center rounded-lg" id="hours">00</div>
        <p class="text-5xl text-white h-[65%] flex items-center">:</p>
        <div class="bg-sky-400 w-[25%] h-[65%] text-7xl text-center rounded-lg" id="minutes">01</div>
        <p class="text-5xl text-white h-[65%] flex items-center">:</p>
        <div class="bg-sky-400 w-[25%] h-[65%] text-7xl text-center rounded-lg" id="seconds">00</div>
    </div>
</body>
</html>
