<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-[#205b7a] w-full flex flex-col justify-center items-center min-h-screen">
    <div class="calculator w-1/4 h-130 bg-[#1a1a1b] flex flex-col p-4 rounded-lg justify-evenly">
        <div class="display text-gray-700 bg-[#a2bbcf] h-[20%] mb-8 rounded-lg text-7xl overflow-hidden p-2">
            <p></p>
        </div>
        <div class="buttons h-[68%]  grid grid-cols-4 grid-rows-5 gap-4 text-white">
            <button onclick="del()" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="c">c</button>
            <button onclick="add_to_display(value)" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="/">/</button>
            <button onclick="add_to_display(value)" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="*">*</button>
            <button onclick="add_to_display(value)" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="-">-</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="9">9</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="8">8</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="7">7</button>
            <button onclick="add_to_display(value)" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="+">+</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="6">6</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="5">5</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="4">4</button>
            <button onclick="calculate()" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] row-span-3 hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="=">=</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="3">3</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="2">2</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="1">1</button>
            <button onclick="add_to_display(value)" class="bg-[#5F6368] rounded-lg hover:bg-[#2c2c2e] hover:shadow-lg hover:shadow-[#163e54]/70" value="0">0</button>
            <button onclick="clearDisplay()" class="bg-[#49a109] rounded-lg hover:bg-[#ff9f0a] col-span-2 hover:shadow-lg hover:shadow-[#ff9f0a]/40" value="Clear">clear</button>
        </div>
    </div>
    <script>
        let display = document.querySelector(".display");
        const operators = ["+", "-", "*", "/"];
        let Current_text = "";
        let flag = false

        function clearDisplay() {
            display.textContent = '';
        }
        function del(dislay_content){
            display.textContent = Current_text.slice(0,Current_text.length-1)
            Current_text = display.textContent;
        }
        function add_to_display(value){
            if(operators.includes(value) && (operators.includes(Current_text[Current_text.length-1]))){
                return;
            }
            display.textContent += value;
            Current_text = display.textContent
        }
        function calculate(){
            display.textContent = eval(Current_text)
        } 
    </script>
</body>
</html>
